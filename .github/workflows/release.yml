name: Edition release packages
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/check.yml
  package:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config qt6-base-dev qt6-svg-dev
      - name: Use stable Rust
        run: rustup update stable && rustup default stable
      - name: Build Rust for Ubuntu 24.04 x86-64
        working-directory: desktop/rust
        run: cargo build --release --locked
      - name: Package both source editions and Rust binary edition
        run: |
          python3 scripts/package_editions.py
          python3 scripts/package_editions.py --edition rust --binary desktop/rust/target/release/bankai-rust --platform linux-x86-64
      - name: Verify extracted edition packages
        run: python3 scripts/check_release_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: bankai-edition-downloads
          path: dist/*
          retention-days: 14
      - name: Attach packages to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
