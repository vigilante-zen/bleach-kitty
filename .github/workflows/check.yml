name: Edition checks
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  installers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Theme and desktop installer checks
        run: python3 -m unittest discover -s tests -v
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r desktop/python/requirements.txt
      - name: Install selected edition in an isolated home
        run: python desktop/python/install.py --home "$RUNNER_TEMP/bankai-home"
      - name: Render manga login theme with dummy data
        run: python login/preview.py
      - name: Snapshot manager checks
        run: python desktop/python/check_snapshot_manager.py
      - name: Offscreen UI checks
        env:
          QT_QPA_PLATFORM: offscreen
          HOME: ${{ runner.temp }}/bankai-home
        run: python desktop/python/check_control_center.py
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config qt6-base-dev qt6-svg-dev
      - name: Use stable Rust
        run: rustup update stable && rustup default stable
      - name: Rust unit tests and release build
        working-directory: desktop/rust
        run: cargo test --locked && cargo build --release --locked
      - name: Compiled binary integration checks
        run: python3 desktop/rust/scripts/check_binary.py
      - name: Install Rust edition in an isolated home
        run: python3 desktop/rust/install.py --home "$RUNNER_TEMP/bankai-home" --binary desktop/rust/target/release/bankai-rust
      - name: Offscreen native UI checks
        env:
          QT_QPA_PLATFORM: offscreen
          BANKAI_HOME: ${{ runner.temp }}/bankai-home
          BANKAI_ARTIFACT_DIR: ${{ runner.temp }}/bankai-screenshots
        run: desktop/rust/target/release/bankai-rust --smoke-test
